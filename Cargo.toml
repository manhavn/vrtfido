[package]
name = "vrtfido"
version = "0.3.5"
edition = "2021"

[lib]
name = "vrtfido"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "vrtfido"
path = "src/main.rs"

# The GTK prompt window runs in its own process so the daemon binary never links
# GTK: a host without the GTK3 runtime keeps working, the window simply never starts.
[[bin]]
name = "vrtfido-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[dependencies]
ciborium = "0.2"
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.10"
rand = "0.10"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
hex = "0.4.3"
rusb = { version = "0.9.4", features = ["vendored"] }
postgres = "0.19.14"
mysql = "28.0.2"
url = "2.5.8"
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-2", "rustls-tls", "dns-resolver"] }
libsql = { version = "0.9.30", default-features = false, features = ["remote", "tls"] }
chrono = "0.4.45"
libc = "0.2.189"
ksni = "0.3.6"
open = "5.4.4"
base64 = "0.22"
jni = { version = "0.21", optional = true }
# GTK3 is used by the desktop GUI module alone. Android and musl targets have no
# GTK to link against, so it stays behind the `gui` feature that build-gui.sh
# enables; every other build compiles the library without it.
gtk = { version = "0.19.0", optional = true }
# The GTK client is a separate process that talks to the daemon over its local HTTP
# API, so the `gui` feature pulls a small blocking HTTP client with it.
ureq = { version = "2", optional = true, features = ["json"] }

[features]
default = []
jni-bridge = ["dep:jni"]
gui = ["dep:gtk", "dep:ureq"]

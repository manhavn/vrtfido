[package]
name = "vrtfido"
version = "0.4.2"
edition = "2021"

[lib]
# The library is `vrtfido_core`, not `vrtfido`: the package ships a *binary* of that name, and the
# cdylib (needed for the Android JNI library alone) would otherwise be written to the same
# `vrtfido.dll` / `vrtfido.so` / `vrtfido.pdb` path as that binary. Cargo reports the clash as an
# "output filename collision" - and on Windows the two artifacts then overwrite each other's debug
# symbols. The exported JNI symbols come from the Java class name, so only the `loadLibrary` call
# and the file the Android build copies are affected.
name = "vrtfido_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "vrtfido"
path = "src/main.rs"

# The prompt window runs in its own process so the daemon binary never links the windowing
# stack: a host without a display or an OpenGL driver keeps working, the window simply never
# starts.
[[bin]]
name = "vrtfido-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[dependencies]
ciborium = "0.2"
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.10"
rand = "0.10"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
hex = "0.4.3"
rusb = { version = "0.9.4", features = ["vendored"] }
postgres = "0.19.14"
mysql = "28.0.2"
url = "2.5.8"
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-2", "rustls-tls", "dns-resolver"] }
libsql = { version = "0.9.30", default-features = false, features = ["remote", "tls"] }
chrono = "0.4.45"
libc = "0.2.189"
open = "5.4.4"
base64 = "0.22"
jni = { version = "0.21", optional = true }
# eframe draws through winit + OpenGL/EGL and ships its own fonts and widgets: the client
# process then needs no toolkit development package at build time and no toolkit runtime on
# any of the release targets, so one source tree produces the window for all of them. The
# default feature set is not used because it selects the wgpu renderer, which drags in a
# whole GPU abstraction stack for a three-widget dialog; `glow` (OpenGL 3.3 / GLES 3.0) is
# enough and still gets a surface on every desktop these packages target. The renderer
# stays behind the `gui` feature because the daemon binary must not link a windowing stack:
# a headless host then runs without one, and Android builds skip it.
eframe = { version = "0.36.2", optional = true, default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# The prompt-window client is a separate process that talks to the daemon over its local
# HTTP API, so the `gui` feature pulls a small blocking HTTP client with it - and the PNG
# decoder that turns the shipped logo into the raw RGBA that `tray_icon::Icon` and the
# window icon want. The daemon and the Android library never link either.
ureq = { version = "2", optional = true, features = ["json"] }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }

# The StatusNotifierItem tray is D-Bus, so `ksni` is linked only where it exists: Linux and
# Android (the daemon's tray, and the library's copy of it). macOS and Windows render their tray
# inside the prompt window from `tray-icon`, declared for those two targets below.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ksni = "0.3.6"

# Menu-bar (macOS) / notification-area (Windows) icon. Both platforms render the icon
# inside the prompt-window process, whose winit event loop owns the main thread those
# APIs require; Linux keeps the daemon-side `ksni` item, which needs no window at all.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26.1"

# Naming winit is the only way to reach `EventLoopBuilderExtMacOS::with_activation_policy`:
# eframe exposes the event-loop builder hook but not the trait, and a bare unbundled binary
# otherwise claims a Dock slot for a dialog. The version matches eframe's own requirement, so
# this unifies with the crate eframe already links rather than adding a second copy.
[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }

# Autostart on Windows is the HKCU "Run" key; on Linux it stays the FreeDesktop
# `~/.config/autostart` entry and on macOS a per-user LaunchAgent property list.
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[features]
default = []
jni-bridge = ["dep:jni"]
gui = ["dep:eframe", "dep:ureq", "dep:image"]

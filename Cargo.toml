[package]
name = "vrtfido"
version = "0.1.1"
edition = "2021"

[dependencies]
ciborium = "0.2"
p256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.10"
rand = "0.10"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
parking_lot = "0.12.5"
hex = "0.4.3"
rusb = { version = "0.9.4", features = ["vendored"] }
postgres = "0.19.14"
mysql = "28.0.2"
url = "2.5.8"
libsql = { version = "0.9.30", default-features = false, features = ["remote", "tls"] }
chrono = "0.4.45"
libc = "0.2.189"
